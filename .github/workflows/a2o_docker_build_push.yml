name: Build Docker Image and Push to A2O GCR

on:
  push:
    branches:
    - main

env:
  PROJECT_ID: ${{ secrets.A2O_GCP_PROJECT_ID }}
  IMAGE: bioacoustics-api

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f211e3e9ded2d9377c8cadc4489a4e38014bc4c9 # v1

    - name: Login to Google Container Registry
      uses: docker/login-action@dd4fa0671be5250ee6f50aedf4cb05514abda2c7 # v1 
      with:
        registry: gcr.io
        username: _json_key
        password: ${{ secrets.A2O_GCR_JSON_KEY }}

    - name: Build and push Docker image
      uses: docker/build-push-action@0a97817b6ade9f46837855d676c4cca3a2471fc9 # v4
      with:
        context: .
        push: true
        tags: |
          gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE }}:latest
          gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE }}:${{ github.sha }}
